name: Notícias do dia
on:
  schedule:
    - cron: "17 9 * * *"   # todo dia às 6h17 (Brasília)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/noticias.py
      - run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add noticias/noticias.json
          git diff --cached --quiet || (git commit -m "Notícias do dia $(date +%F)" && git push)
